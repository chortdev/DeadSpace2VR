# Publishes the package in this repository as a GitHub Release, so the
# Releases page offers the ZIP and not only GitHub's source-code archives.
# The version comes from SHA256SUMS. An existing tag v<version> is reused;
# otherwise the tag is created on the pushed commit. A release that already
# exists is left alone (re-uploading would reset its download counts).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha256sum -c SHA256SUMS
          ver=$(sed -n 's/.*DS2PCVR-\([0-9][0-9.]*\)-[a-z]*\.zip$/\1/p' SHA256SUMS | sort -u)
          if [ -z "$ver" ] || [ "$(printf '%s\n' "$ver" | wc -l)" -ne 1 ]; then
            echo "SHA256SUMS must name exactly one DS2PCVR version, got: $ver" >&2
            exit 1
          fi
          tag="v$ver"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          {
            git tag -l --format='%(contents)' "$tag"
            echo "Install steps and requirements: see the README."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "DS2PCVR $ver" --notes-file notes.md \
            DS2PCVR-"$ver"-*.zip SHA256SUMS MarkerPatch-VR.ps1
